[project]
name = "gcal-mcp"
version = "0.1.0"
description = "MCP server exposing Google Calendar to coding agents (CS146S week 2)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12",
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
gcal-mcp = "gcal_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
